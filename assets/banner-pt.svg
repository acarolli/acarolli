<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Ayslan Carolli</title>
  <desc id="d">Engenheiro eletricista com mais de 15 anos em operações industriais, dados e automação. Ilustração: um sinal elétrico entra numa rede neural que vira barras crescendo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1C"/>
      <stop offset="1" stop-color="#121A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .label { fill: #64748B; font: 600 11px ui-monospace, Consolas, monospace; letter-spacing: 2px; text-anchor: middle; }
    .sine { fill: none; stroke: #38BDF8; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 6 5;
            animation: flow 0.9s linear infinite; }
    .edge { fill: none; stroke: #334155; stroke-width: 1; }
    .pulse { fill: none; stroke: #7DD3FC; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 10 100;
             stroke-dashoffset: 10; animation: pulse 4.5s linear infinite backwards; }
    .node { fill: #0B1222; stroke: #475569; stroke-width: 2; animation: node 4.5s ease-out infinite backwards; }
    .bar { fill: url(#barFill); transform-box: fill-box; transform-origin: 50% 100%;
           animation: bar 4.5s cubic-bezier(.2,.8,.2,1) infinite backwards; }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    @keyframes pulse { 0% { stroke-dashoffset: 10; } 14% { stroke-dashoffset: -100; } 100% { stroke-dashoffset: -100; } }
    @keyframes node {
      0% { fill: #0B1222; stroke: #475569; }
      4% { fill: #7DD3FC; stroke: #E0F2FE; }
      22% { fill: #0E7490; stroke: #38BDF8; }
      60% { fill: #0B1222; stroke: #475569; }
      100% { fill: #0B1222; stroke: #475569; }
    }
    @keyframes bar {
      0% { transform: scaleY(0.12); }
      10% { transform: scaleY(1); }
      62% { transform: scaleY(1); }
      80% { transform: scaleY(0.12); }
      100% { transform: scaleY(0.12); }
    }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .sine, .pulse, .node, .bar, .cursor { animation: none; }
      .pulse { display: none; }
      .node { fill: #0E7490; stroke: #38BDF8; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
    <rect x="0" y="0" width="6" height="380" fill="#38BDF8"/>
  </g>

  <g transform="translate(64 0)">
    <text class="mono" x="0" y="92" font-size="17" fill="#64748B">~/acarolli $ whoami</text>
    <text class="sans" x="0" y="168" font-size="66" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Ayslan Carolli</text>
    <text class="sans" x="2" y="214" font-size="25" font-weight="600" fill="#38BDF8">Engenheiro Eletricista · Ciência de Dados</text>
    <text class="sans" x="2" y="254" font-size="18" fill="#94A3B8">Transformação digital · Automação · Integração · IA</text>
    <text class="mono" x="2" y="318" font-size="16" fill="#CBD5E1">&gt; criatividade aplicada a problemas complexos<tspan class="cursor" fill="#38BDF8">_</tspan></text>
  </g>

